<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VYBE — твій простір</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#100d1c;color:#fff}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}.shell{max-width:520px;margin:auto;min-height:100dvh;background:#171226;position:relative}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #ffffff18}.logo{font-size:29px;font-weight:900;letter-spacing:-2px}.logo span{color:#ff8b82}.tag{color:#d4c7f4;font-size:12px}.feed{height:calc(100dvh - 144px);min-height:360px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.clip{height:100%;min-height:360px;position:relative;scroll-snap-align:start;background:radial-gradient(circle at 30% 30%,#5d347f,#1b1731 65%);overflow:hidden}.clip video{width:100%;height:100%;object-fit:contain;background:#080610}.gradient{position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#080610c9);pointer-events:none}.details{position:absolute;bottom:28px;left:20px;right:90px;text-shadow:0 2px 9px #000}.details strong{display:block;margin-bottom:8px}.details p{margin:0;font-size:14px}.actions{position:absolute;right:14px;bottom:40px;display:grid;gap:18px}.action{border:0;color:white;background:#241a38b8;border-radius:18px;padding:10px;min-width:57px;font-size:22px}.action small{display:block;font-size:11px}.bottom{height:78px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #ffffff22}.nav{background:none;border:0;color:#e9defc;display:grid;gap:4px;text-align:center;font-size:22px}.nav small{font-size:11px}.plus,.primary{background:linear-gradient(120deg,#ae83ff,#ff8c83);color:#1a102b;border:0;border-radius:14px;padding:11px 18px;font-weight:800}.page{padding:24px;min-height:calc(100dvh - 144px)}h1{font-size:27px;margin:0 0 12px}p.muted,.muted{color:#b9aaca}.panel{background:#261d39;border:1px solid #ffffff16;border-radius:20px;padding:18px;margin:16px 0}.field{display:block;width:100%;background:#130e20;border:1px solid #75618f;border-radius:12px;padding:13px;color:white;margin:10px 0}.secondary{background:#332749;color:white;border:0;border-radius:12px;padding:10px 14px}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#d6c7f0}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:end;justify-content:center;z-index:5}.dialog{background:#261b39;border-radius:24px 24px 0 0;padding:24px;width:min(520px,100%);max-height:80dvh;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.comment{padding:12px 0;border-bottom:1px solid #ffffff1a}.comment b{color:#c9aaff}.hidden{display:none!important}.circle{display:inline-block;background:#493365;border-radius:100px;padding:10px 14px;margin:5px}a{color:#e0c4ff}@media(min-width:650px){.shell{border-left:1px solid #403451;border-right:1px solid #403451}}
</style></head><body><div class="shell"><header class="top"><div class="logo">vybe<span>✦</span></div><div class="tag">Тут народжуються історії</div></header><main id="main"></main><footer class="bottom"><button class="nav" onclick="show('feed')">⌂<small>Потік</small></button><button class="nav" onclick="show('explore')">✧<small>Відкривай</small></button><button class="plus" onclick="show('upload')">＋</button><button class="nav" onclick="show('profile')">◉<small>Профіль</small></button></footer></div><div id="overlay" class="overlay hidden"><div class="dialog"><div class="row"><h2 id="dialogtitle"></h2><button class="secondary" onclick="closeDialog()">✕</button></div><div id="dialogbody"></div></div></div><script>
let token=localStorage.getItem('vybe_token')||'',username=localStorage.getItem('vybe_user')||'',items=[],page='feed';const main=document.getElementById('main');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){let headers={...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;if(opts.json){headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.json);delete opts.json}let r=await fetch('/api'+path,{...opts,headers});let data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.detail||'Помилка запиту');return data}
function notify(e){alert(e.message||e)}function show(p){page=p;if(p==='feed')loadFeed();else if(p==='explore')main.innerHTML='<section class="page"><h1>✧ Відкривай</h1><p class="muted">Твій простір для творчості, відкриттів і спільнот.</p><div class="panel"><h2>Тематичні кола</h2><span class="circle">🎨 Творчість</span><span class="circle">🌿 Природа</span><span class="circle">🎮 Ігри</span><span class="circle">🌍 Подорожі</span><p class="muted">Приєднання до кіл з’явиться в наступних версіях.</p></div></section>';else if(p==='upload')uploadPage();else profilePage()}
async function loadFeed(user=''){main.innerHTML='<div class="feed"><div class="empty">Завантаження…</div></div>';try{items=await api('/videos'+(user?'?username='+encodeURIComponent(user):''));let f=document.createElement('div');f.className='feed';if(!items.length){f.innerHTML='<div class="empty"><div><h1>Тут починається VYBE ✦</h1><p>Ще немає відео. Стань першим автором!</p><button class="primary" onclick="show(\'upload\')">Опублікувати відео</button></div></div>'}else items.forEach(v=>{let el=document.createElement('article');el.className='clip';el.innerHTML=`<video controls playsinline preload="metadata" src="${encodeURI(v.url)}"></video><div class="gradient"></div><div class="details"><strong>@${escapeHtml(v.username)}</strong><p>${escapeHtml(v.caption)}</p></div><div class="actions"><button class="action" data-like="${v.id}">${v.liked?'💜':'♡'}<small>${v.likes}</small></button><button class="action" data-comment="${v.id}">☏<small>${v.comments}</small></button></div>`;f.append(el)});main.replaceChildren(f);f.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{if(!token)return show('profile');try{let d=await api('/videos/'+b.dataset.like+'/like',{method:'POST'});b.innerHTML=(d.liked?'💜':'♡')+'<small>'+d.likes+'</small>'}catch(e){notify(e)}});f.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>comments(b.dataset.comment));const observer=new IntersectionObserver(entries=>entries.forEach(e=>{let v=e.target.querySelector('video');if(!v)return;if(e.isIntersecting){document.querySelectorAll('.clip video').forEach(other=>{if(other!==v)other.pause()})}else v.pause()}),{root:f,threshold:.65});f.querySelectorAll('.clip').forEach(x=>observer.observe(x))}catch(e){main.textContent=e.message}}
function profilePage(){if(!token){main.innerHTML='<section class="page"><h1>👤 Твій профіль</h1><p class="muted">Увійди або створи акаунт, щоб публікувати відео.</p><div class="panel"><h2 id="authTitle">Створити акаунт</h2><form id="authForm"><input class="field" id="user" placeholder="Ім’я користувача" required minlength="3" maxlength="24" autocomplete="username"><input class="field" id="password" type="password" placeholder="Пароль (від 8 символів)" required minlength="8" autocomplete="new-password"><button class="primary">Продовжити</button></form><p><button class="secondary" id="switchAuth">У мене вже є акаунт</button></p></div></section>';let mode='register';document.getElementById('switchAuth').onclick=()=>{mode=mode==='register'?'login':'register';document.getElementById('authTitle').textContent=mode==='register'?'Створити акаунт':'Увійти';document.getElementById('switchAuth').textContent=mode==='register'?'У мене вже є акаунт':'Створити акаунт'};document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();try{let d=await api('/'+mode,{method:'POST',json:{username:document.getElementById('user').value,password:document.getElementById('password').value}});token=d.token;username=d.username;localStorage.setItem('vybe_token',token);localStorage.setItem('vybe_user',username);profilePage()}catch(err){notify(err)}};return}main.innerHTML=`<section class="page"><h1>✦ @${escapeHtml(username)}</h1><p class="muted">Твоя історія починається тут.</p><button class="primary" id="mine">Мої відео</button> <button class="secondary" id="logout">Вийти</button><div class="panel">Твій особистий простір VYBE 💜</div></section>`;document.getElementById('mine').onclick=()=>loadFeed(username);document.getElementById('logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}catch(e){}token='';username='';localStorage.removeItem('vybe_token');localStorage.removeItem('vybe_user');profilePage()}}
function uploadPage(){if(!token){profilePage();return}main.innerHTML='<section class="page"><h1>＋ Нова історія</h1><p class="muted">Поділися своїм моментом з іншими.</p><form id="uploadForm" class="panel"><label>Відео (MP4, WebM або MOV; до 100 МБ)<input class="field" type="file" name="file" accept="video/mp4,video/webm,video/quicktime" required></label><textarea class="field" name="caption" maxlength="300" rows="3" placeholder="Про що твоє відео?"></textarea><button class="primary">Опублікувати</button><p id="uploadStatus" class="muted"></p></form></section>';document.getElementById('uploadForm').onsubmit=async e=>{e.preventDefault();let form=e.target,button=form.querySelector('button'),status=document.getElementById('uploadStatus');button.disabled=true;status.textContent='Завантаження…';try{await api('/videos',{method:'POST',body:new FormData(form)});show('feed')}catch(err){status.textContent=err.message}finally{button.disabled=false}}}
function openDialog(title){document.getElementById('dialogtitle').textContent=title;document.getElementById('overlay').classList.remove('hidden')}function closeDialog(){document.getElementById('overlay').classList.add('hidden')}
async function comments(id){openDialog('Коментарі');let body=document.getElementById('dialogbody');body.textContent='Завантаження…';try{let comments=await api('/videos/'+id+'/comments');body.replaceChildren();comments.forEach(c=>{let el=document.createElement('div');el.className='comment';let b=document.createElement('b');b.textContent='@'+c.username;let p=document.createElement('p');p.textContent=c.body;el.append(b,p);body.append(el)});if(!comments.length){let p=document.createElement('p');p.textContent='Коментарів ще немає.';body.append(p)}if(token){let form=document.createElement('form');form.innerHTML='<input class="field" maxlength="500" required placeholder="Твій коментар…"><button class="primary">Надіслати</button>';form.onsubmit=async e=>{e.preventDefault();try{await api('/videos/'+id+'/comments',{method:'POST',json:{body:form.querySelector('input').value}});commentsDialogRefresh(id)}catch(err){notify(err)}};body.append(form)}else{let p=document.createElement('p');p.textContent='Увійди, щоб коментувати.';body.append(p)}}catch(e){body.textContent=e.message}}
async function commentsDialogRefresh(id){await comments(id);loadFeed()}
show('feed');
</script></body></html>
